[package]
name = "singing-materials-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
midir = "0.11.0"
ratatui = "0.30.2"
rustfft = "6.4.1"
dsp-core = { git = "https://github.com/rlundquist3/synths.git", rev = "ec7c4d3" }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
futures = "0.3"
